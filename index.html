<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciamento de Filmes</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://kit.fontawesome.com/c01882b0ab.js" crossorigin="anonymous"></script>
</head>

<body>
    <header>

        <section class="cab-fixed">
            <div class="cabecalho">
                <i class="fa-solid fa-bars burguer"></i>
                <div>
                    <i class="fa-solid fa-sun sun"></i>
                    <div class="identificador">
                        <p>E</p>
                    </div>
                </div> <!-- CIRCULO PARA PERFIL -->
            </div>
        </section>

    </header>
    <main>

        <section class="informacoes-form">
            <div class="apresentacao">
                <h1>Olá, <span class="destaque">Example!</span></h1>
                <p>Sua coleção de filmes e séries, em um só lugar.</p>
            </div>
            <div class="area-de-pesquisa">
                <label for="nome-filme" class="sr-only">
                    Pesquisar filmes e séries
                </label>
                <label for="nome-filme">
                    <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
                </label>
                <input type="text" name="nome-filme" id="nome-filme" placeholder="Pesquisa por título...">
            </div>
        </section>

        <section class="gerenciamento">
            <div class="adicionar">
                <div id="adicionar">
                    <p>+</p>
                </div>
                <div class="info">
                    <h2>Adicionar</h2>
                    <p>Cadastre um novo título na sua página: Filme, Anime ou Série.</p>
                </div>
            </div>

            <hr color="#111927">

            <div class="categorias">
                <select name="filmes" id="genero-de-filmes">
                    <option class="title-options" value="" disabled selected>Selecione uma categoria</option>
                    <option value="acao">Ação</option>
                    <option value="aventura">Aventura</option>
                    <option value="animacao">Animação</option>
                    <option value="comedia">Comédia</option>
                    <option value="drama">Drama</option>
                    <option value="fantasia">Fantasia</option>
                    <option value="ficcao-cientifica">Ficção científica</option>
                    <option value="romance">Romance</option>
                    <option value="terror">Terror</option>
                    <option value="suspense">Suspense</option>
                    <option value="misterio">Mistério</option>
                    <option value="crime">Crime</option>
                    <option value="isekai">Isekai</option>
                    <option value="esportes">Esportes</option>
                </select>
                <select name="stats" id="status">
                    <option class="title-options" value="" disabled selected>Selecione um status</option>
                    <option value="assistidos">Assistidos</option>
                    <option value="nao-assistidos">Não Assistidos</option>
                    <option value="maiores-avaliacoes">Maiores Avaliações</option>
                    <option value="menores-avaliacoes">Menores Avaliações</option>
                </select>
            </div>
        </section>

    </main>
    <script src="js/script.js"></script>
</body>

</html>
